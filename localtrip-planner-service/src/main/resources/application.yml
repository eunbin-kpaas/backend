spring:
  application:
    name: "localtrip-planner-service"

  datasource:
    url: jdbc:mysql://localhost:3306/localtrip?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

server:
  port: 8083

# LocalTrip 라이브러리 설정
localtrip:
  # Auth Core 설정
  auth:
    enabled: true
    gateway-token: ""
    public-paths:
      - "/actuator/health"
      - "/error"

# Gateway Authentication 설정
gateway:
  auth:
    token: ""  # 개발 환경에서는 비활성화

logging:
  level:
    com.localtrip.planner: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
