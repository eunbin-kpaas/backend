spring:
  # 테스트용 데이터베이스 설정 (H2 In-Memory)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
    
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        
  # Redis 설정 (테스트용 Embedded Redis 또는 Mock)
  data:
    redis:
      host: localhost
      port: 6370  # 다른 포트 사용하여 충돌 방지
      
  # 메일 설정 비활성화
  mail:
    host: localhost
    port: 587
    username: test
    password: test

# LocalTrip 라이브러리 설정
localtrip:
  auth:
    enabled: true
    gateway-token: test-gateway-token
    public-paths:
      - "/**"  # 테스트에서는 모든 경로 허용
  web:
    global-logging-enabled: false
    request-logging-enabled: false

# JWT 설정
jwt:
  secret: test-secret-key-for-unit-testing-only-not-for-production-use
  access-token-validity: 86400000
  refresh-token-validity: 604800000

# 메일 설정
mail:
  verification:
    subject: "[Test] 이메일 인증 코드"
    expiry-minutes: 5

# 로깅 설정
logging:
  level:
    com.localtrip: WARN
    org.springframework: WARN
    org.hibernate: WARN
