server:
  port: 8081

spring:
  application:
    name: localtrip-member-service
    
  # MySQL 데이터베이스 설정
  datasource:
    url: jdbc:mysql://localhost:3306/localtrip?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update  # 테이블 자동 생성
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
    
  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          
  # 메일 설정 (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: choeunbin0324
    password: sfmr bdjg wvjp skph
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

# LocalTrip 라이브러리 설정
localtrip:
  # Auth Core 설정
  auth:
    enabled: true
    gateway-token: ""
    public-paths:
      - "/api/members/check-id"
      - "/api/members/send-verification"
      - "/api/members/verify-email"  
      - "/api/members/signup"
      - "/api/members/login"
      - "/actuator/health"
      - "/swagger-ui/**"
      - "/v3/api-docs/**"
      - "/error"
    admin-paths:
      - "/actuator/**"
      
  # Web Starter 설정  
  web:
    global-logging-enabled: true
    request-logging-enabled: true
    sample-rate: 1.0
    log-request-body: false
    exclude-patterns:
      - "/actuator/**"
      - "/health"
      - "/swagger-ui/**"

# JWT 설정
jwt:
  secret: 1504bea5eae9eae78725c1a856fed5e893f0a647479ea6cab2679e48fc8854e50c99b9b0dc4bb8bd4057a0fd6c34d31c8ef2cb11f2452eefa5409d6edca209cc
  access-token-validity: 86400000   # 24시간 (밀리초)
  refresh-token-validity: 604800000  # 7일 (밀리초)

# 메일 템플릿 설정
mail:
  verification:
    subject: "[LocalTrip] 이메일 인증 코드"
    expiry-minutes: 5

# 로깅 설정
logging:
  level:
    com.localtrip: DEBUG
    org.springframework.security: DEBUG
    org.springframework.mail: DEBUG
    com.sun.mail: DEBUG
    jakarta.mail: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  charset:
    console: UTF-8
    file: UTF-8